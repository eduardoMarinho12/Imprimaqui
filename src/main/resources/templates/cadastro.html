<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Imprimaqui</title>
    <link rel="stylesheet" th:href="@{/css/cadastro.css}" href="/css/cadastro.css">
</head>
<body>
<div class="auth-shell">
    <aside class="auth-aside">
        <div class="brand">
            <div class="brand-mark">IQ</div>
            <span>Imprimaqui</span>
        </div>

        <div>
            <h1>Crie sua conta e comece seu pedido.</h1>
        </div>
    </aside>

    <main class="auth-main">
        <div class="top-links">
            <span><a href="/home">Voltar para a home</a></span>
            <span>Já tem conta? <a href="/login">Fazer login</a></span>
        </div>

        <div class="title-block">
            <h2>Cadastro</h2>
            <p>Preencha seus dados para entrar no sistema e continuar seu fluxo de impressão.</p>
        </div>

        <div class="feedback error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div class="form-card">
            <form class="form-grid" method="post" action="/cadastro" th:object="${registerForm}">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="Seu nome completo" required>
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="form-group">
                    <label for="age">Idade</label>
                    <input type="number" id="age" th:field="*{age}" min="0" placeholder="Sua idade" required>
                    <div class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                </div>

                <div class="form-group full">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="seuemail@exemplo.com" required>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group full">
                    <label for="password">Senha</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Crie uma senha" required>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-group full">
                    <label for="password">Digite novamente a senha</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Digite novamente a senha" required>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" type="submit">Cadastrar</button>
                    <a class="btn btn-secondary" href="/login">Já tenho login</a>
                </div>
            </form>
        </div>

        <p class="note">
           Espaço destinado a termos e condições.
        </p>
    </main>
</div>
</body>
</html>
